[project]
name = "indicadores"
version = "0.1.0"
description = "Pipeline de dados do Indicadores BR"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
indicadores = "indicadores.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indicadores"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
