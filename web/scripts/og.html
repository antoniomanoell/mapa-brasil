<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        background: #ffffff;
        color: #1a1a1a;
        display: flex;
        align-items: center;
      }
      .card {
        padding: 72px 88px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        box-sizing: border-box;
      }
      h1 {
        font-size: 84px;
        margin: 0 0 16px;
        color: #08519c;
      }
      p {
        font-size: 36px;
        margin: 0;
        max-width: 640px;
        line-height: 1.3;
        color: #4a4a4a;
      }
      .barras {
        display: flex;
        align-items: flex-end;
        gap: 18px;
        height: 300px;
      }
      .barras span {
        width: 56px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <h1>Indicadores BR</h1>
        <p>Indicadores socioeconômicos por estado, de 2000 até hoje, com fontes oficiais.</p>
      </div>
      <div class="barras" aria-hidden="true">
        <span style="height: 30%; background: #c6dbef"></span>
        <span style="height: 48%; background: #9ecae1"></span>
        <span style="height: 64%; background: #6baed6"></span>
        <span style="height: 82%; background: #3182bd"></span>
        <span style="height: 100%; background: #08519c"></span>
      </div>
    </div>
  </body>
</html>
